name: Daily story

# Picks the day's story, has the headline editor write it with the company Anthropic key, emails it through the
# Worker and commits the updated backlog. See "The daily run" in AGENTS.md.
#
# GitHub crons run in UTC and can start late, so there are two, and the run only goes ahead from 06:00 London.
# In winter the 05:00 UTC run is 05:00 London and stops; in summer the 06:00 UTC run is 07:00 London and finds
# the day already sent. The Worker refuses a second send for the same date either way.

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, send nothing and commit nothing
        type: boolean
        default: true
      date:
        description: Issue date (YYYY-MM-DD), default today in London
        required: false
      story:
        description: Run this story id instead of the pick
        required: false

permissions:
  contents: write

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      WORKER_URL: ${{ vars.WORKER_URL || 'https://build40for40.com/feel-good' }}
      DRY_RUN: ${{ inputs.dry_run }}
      ISSUE_DATE: ${{ inputs.date }}
      STORY_ID: ${{ inputs.story }}
    steps:
      - name: Wait for 06:00 London
        id: clock
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hour" -lt 6 ]; then
            echo "It's $hour:00 in London, so the other cron will run it."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the secrets are there
        if: steps.clock.outputs.go == 'true'
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY isn't available to this repository."; exit 1; }
          [ -n "$PUBLISH_TOKEN" ] || { echo "::error::PUBLISH_TOKEN isn't set. It's the Worker's PULL_TOKEN."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.clock.outputs.go == 'true'

      - name: Install the Anthropic SDK
        if: steps.clock.outputs.go == 'true'
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet anthropic

      - name: Run the daily story
        if: steps.clock.outputs.go == 'true'
        run: |
          args=(--worker "$WORKER_URL")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -n "$ISSUE_DATE" ] && args+=(--date "$ISSUE_DATE")
          [ -n "$STORY_ID" ] && args+=(--story "$STORY_ID")
          "$RUNNER_TEMP/venv/bin/python" scripts/daily.py "${args[@]}"

      - name: Commit the updated backlog
        if: steps.clock.outputs.go == 'true' && inputs.dry_run != true
        run: |
          git add data/backlog.json runs/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish the daily story for $(TZ=Europe/London date +%F)"
          git pull --rebase
          git push
